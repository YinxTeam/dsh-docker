services:
  deepseek-harness:
    build:
      context: .
      args:
        DSH_VERSION: latest   # 本地构建时安装的 dsh 版本
    # 默认拉取 CI 构建好的镜像;如需本地构建,执行 docker compose build,
    # 并设置 DSH_IMAGE=deepseek-harness:local
    image: "${DSH_IMAGE:-ghcr.io/yinxteam/dsh-docker:latest}"
    container_name: deepseek-harness
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      # 两项都留空表示不启用 basic auth
      DSH_AUTH_USERNAME: "${DSH_AUTH_USERNAME:-}"
      DSH_AUTH_PASSWORD: "${DSH_AUTH_PASSWORD:-}"
      # 默认工作目录,位于 dsh-data 卷内;如需改到别处,同时挂载对应路径
      DSH_WORKSPACE: "${DSH_WORKSPACE:-/data/dsh/home/workspace}"
    volumes:
      - dsh-data:/data/dsh

volumes:
  dsh-data:
